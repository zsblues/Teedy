name: Teedy CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置JDK 11
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      # 3. Maven 编译
      - name: Maven Build
        run: mvn clean compile -DskipTests --batch-mode

      # 4. PMD 代码检查
      - name: PMD Code Analysis
        run: mvn pmd:pmd --batch-mode
        continue-on-error: true

      - name: Archive PMD Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-reports
          path: '**/target/pmd.xml'

      # 5. 运行测试
      - name: Run Tests
        run: mvn test --batch-mode

      # 6. 生成测试报告
      - name: Generate Test Reports
        if: always()
        run: mvn surefire-report:report --batch-mode

      - name: Archive Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/surefire-reports/*.xml'

      - name: Archive Test HTML Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-html-reports
          path: '**/target/site/surefire-report.html'

      # 7. 生成JavaDoc文档
      - name: Generate JavaDoc
        run: mvn javadoc:aggregate --batch-mode

      - name: Archive JavaDoc
        uses: actions/upload-artifact@v4
        with:
          name: javadoc
          path: 'target/site/apidocs/'

      # 8. 打包项目
      - name: Package Project
        run: mvn package -DskipTests --batch-mode

      # 9. 归档构建产物
      - name: Archive JAR Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jar-artifacts
          path: '**/target/*.jar'

      - name: Archive WAR Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: war-artifacts
          path: '**/target/*.war'

  # 总结构建结果
  summary:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build Summary
        run: |
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "## ✅ CI流水线执行成功" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ CI流水线执行失败" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- Maven编译 → PMD检查 → 测试 → 测试报告 → JavaDoc → 打包 → 归档" >> $GITHUB_STEP_SUMMARY
